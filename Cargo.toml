# Its own workspace root. Without this, cargo run from inside this repository
# walks up, finds Xmip/Cargo.toml and refuses — a module that only builds
# inside its parent is not an independent repository.
[workspace]

[package]
name = "xmip-core-journey"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-journey"
description = "Journey state, lineage and append-only execution history for Xmip."

[dependencies]
xcore = { package = "xmip-core", git = "https://github.com/IlleNilsson/xmip-core", branch = "main" }
# A Journey's one binary form, what the Ledger keeps (`record`): written and
# read over the estate's one byte writer and cursor.
codec = { package = "xmip-core-library-codec", git = "https://github.com/IlleNilsson/xmip-core-library-codec", branch = "main" }

[profile.dev.package."*"]
opt-level = 3
